    <link rel="icon" type="image/png" href="image/logo_1.png">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Outfit:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="image/logo_1.png" alt="TBS ACADEMY Logo" class="brand-logo" onerror="this.style.display='none'">
                <span>TBS</span> ACADEMY
            </a>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav id="navMenu">
            <ul>
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-dropdown">
                    <a href="quiz.html" class="nav-link">Quiz <i class="fa-solid fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="quiz.html?cat=class8"><i class="fa-solid fa-book"></i> Class 8</a></li>
                        <li><a href="quiz.html?cat=class9-10"><i class="fa-solid fa-book-open"></i> Class 9-10</a></li>
                        <li><a href="quiz.html?cat=ssc2027"><i class="fa-solid fa-award"></i> SSC 2027</a></li>
                        <li><a href="quiz.html?cat=ssc2028"><i class="fa-solid fa-fire"></i> SSC 2028</a></li>
                    </ul>
                </li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="index.html#videos" class="nav-link">YouTube Videos</a></li>
                <li><a href="register.html" class="nav-link active-link">Register</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>

                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Student Registration Section -->
    <section id="register" class="register-section">
        <h2><i class="fa-solid fa-user-pen"></i> Student Registration</h2>
        <p class="subtitle">Fill the form below to join online batches for SSC preparation.</p>

        <div class="register-card">
            <form id="registerForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" name="studentName" placeholder="e.g. Rakib Hasan" required>
                    </div>
                    <div class="form-group">
                        <label for="studentPhone">Phone (WhatsApp)</label>
                        <input type="tel" id="studentPhone" name="studentPhone" placeholder="e.g. 01712345678" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="studentClass">Target Exam</label>
                        <select id="studentClass" name="studentClass" required>
                            <option value="" disabled selected>Select your target</option>
                            <option value="SSC 2027">SSC 2027</option>
                            <option value="SSC 2026">SSC 2026</option>
                            <option value="SSC 2025">SSC 2025</option>
                            <option value="Scholarship / Admission">Scholarship / Admission</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="studentEmail">Email (optional)</label>
                        <input type="email" id="studentEmail" name="studentEmail" placeholder="e.g. rakib@gmail.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Subjects Needed</label>
                    <div class="checkbox-group">
                        <label class="check-item"><input type="checkbox" name="subjects" value="Higher Math"> Higher Math</label>
                        <label class="check-item"><input type="checkbox" name="subjects" value="Physics"> Physics</label>
                        <label class="check-item"><input type="checkbox" name="subjects" value="Chemistry"> Chemistry</label>
                        <label class="check-item"><input type="checkbox" name="subjects" value="Biology"> Biology</label>
                        <label class="check-item"><input type="checkbox" name="subjects" value="English"> English</label>
                        <label class="check-item"><input type="checkbox" name="subjects" value="Bangla"> Bangla</label>
                        <label class="check-item"><input type="checkbox" name="subjects" value="ICT"> ICT</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="studentNote">Message (optional)</label>
                    <textarea id="studentNote" name="studentNote" rows="3" placeholder="Any questions about the batch schedule, fees, etc."></textarea>
                </div>

                <button type="submit" class="btn primary-btn register-btn"><i class="fa-solid fa-paper-plane"></i> Submit Registration</button>
                <p class="form-status" id="formStatus"></p>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 TBS ACADEMY | All Rights Reserved.</p>
    </footer>

    <script src="register.js"></script>
</body>
</html>
